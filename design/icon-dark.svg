<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="0.55" stop-color="#059669"/>
      <stop offset="1" stop-color="#064E3B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.18" r="0.7">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wallet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="flap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#065F46"/>
      <stop offset="1" stop-color="#064E3B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#022C22" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="#0B1411"/>
  <rect width="1024" height="1024" fill="url(#glow)" opacity="0.25"/>

  <!-- Receipt (behind wallet) -->
  <g filter="url(#shadow)" transform="rotate(-6 512 420)">
    <path d="M372 470 V250 l26 -22 26 22 26 -22 26 22 26 -22 26 22 26 -22 26 22 26 -22 26 22 26 -22 26 22 V470 Z"
          fill="#FFFFFF"/>
    <rect x="420" y="292" width="184" height="22" rx="11" fill="#A7F3D0"/>
    <rect x="420" y="340" width="130" height="22" rx="11" fill="#A7F3D0"/>
    <rect x="420" y="388" width="160" height="22" rx="11" fill="#A7F3D0"/>
  </g>

  <!-- Wallet body -->
  <g filter="url(#shadow)">
    <rect x="232" y="420" width="560" height="372" rx="72" fill="url(#wallet)"/>
    <rect x="232" y="486" width="378" height="10" rx="5" fill="#6EE7B7"/>
    <!-- clasp tab -->
    <path d="M610 536 h182 v140 h-182 a70 70 0 0 1 0 -140 Z" fill="url(#flap)"/>
    <circle cx="616" cy="606" r="30" fill="#A7F3D0"/>
  </g>
</svg>
