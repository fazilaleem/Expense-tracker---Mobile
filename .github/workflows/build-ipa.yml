name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # to publish UI screenshots to the `screenshots` branch

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick and boot simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')]
          pro=[x for x in c if x['name'].endswith('Pro')]
          print((pro or c)[-1]['udid'])")
          echo "UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project ExpenseTracker.xcodeproj \
            -scheme ExpenseTracker \
            -destination "id=$UDID" \
            -derivedDataPath simbuild \
            CODE_SIGNING_ALLOWED=NO | xcbeautify || exit ${PIPESTATUS[0]}

      - name: Build unsigned app for iPhone
        run: |
          xcodebuild build \
            -project ExpenseTracker.xcodeproj \
            -scheme ExpenseTracker \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | xcbeautify || exit ${PIPESTATUS[0]}

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ExpenseTracker.app Payload/
          zip -qry ExpenseTracker.ipa Payload
          ls -lh ExpenseTracker.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ExpenseTracker-ipa
          path: ExpenseTracker.ipa
          retention-days: 30

      - name: UI screenshots (demo data, light + dark)
        continue-on-error: true
        run: |
          APP=com.personal.expensetracker
          mkdir -p shots
          # Fresh install so nothing from the test run (e.g. permission prompts) lingers.
          xcrun simctl uninstall "$UDID" $APP 2>/dev/null || true
          xcrun simctl install "$UDID" simbuild/Build/Products/Debug-iphonesimulator/ExpenseTracker.app
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          names=(overview transactions insights budgets settings)
          for mode in light dark; do
            xcrun simctl ui "$UDID" appearance $mode
            for t in 0 1 2 3 4; do
              xcrun simctl terminate "$UDID" $APP 2>/dev/null || true
              xcrun simctl launch "$UDID" $APP -seedDemo YES -hasOnboarded YES -startTab $t \
                -defaultCurrency AED
              sleep 5
              xcrun simctl io "$UDID" screenshot "shots/${mode}-${t}-${names[$t]}.png"
            done
            for target in categories bottom; do
              xcrun simctl terminate "$UDID" $APP 2>/dev/null || true
              xcrun simctl launch "$UDID" $APP -seedDemo YES -hasOnboarded YES -startTab 0 \
                -defaultCurrency AED -demoScrollTo $target
              sleep 6
              xcrun simctl io "$UDID" screenshot "shots/${mode}-0-overview-${target}.png"
            done
            xcrun simctl terminate "$UDID" $APP 2>/dev/null || true
            xcrun simctl launch "$UDID" $APP -seedDemo YES -hasOnboarded YES -startTab 0 \
              -defaultCurrency AED -demoShowAdd YES
            sleep 5
            xcrun simctl io "$UDID" screenshot "shots/${mode}-5-add.png"
          done
          # Onboarding / setup guide
          xcrun simctl ui "$UDID" appearance light
          xcrun simctl terminate "$UDID" $APP 2>/dev/null || true
          xcrun simctl launch "$UDID" $APP -seedDemo YES -hasOnboarded NO -defaultCurrency AED
          sleep 5
          xcrun simctl io "$UDID" screenshot shots/light-4-setup.png
          ls -la shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots
          retention-days: 14
          if-no-files-found: ignore

      - name: Publish screenshots to `screenshots` branch
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          cd shots
          git init -q
          git checkout -q -b screenshots
          git add .
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -qm "UI screenshots for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" screenshots
